<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">With AI agents, code output rose about 30% and PRs 23%, but resolved issues rose only 12% while review time rose 49%</title><style>.t{font:600 15px Inter,system-ui,sans-serif;fill:#1F1E1D}.s{font:400 12.5px Inter,system-ui,sans-serif;fill:#6B6A65}.n{font:600 13px "JetBrains Mono",ui-monospace,monospace;fill:#1F1E1D}.a{fill:#C2603F}</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8A877F"/></marker></defs>
<rect width="760" height="330" rx="16" fill="#FAF9F5"/>
<text x="40" y="44" class="t">Agents widened the top of the pipe. Review didn't widen with it.</text>
