<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t2">Three review lanes: low risk gets an automated pass and a quick human check, medium gets author notes and full review, high gets two human reviewers including an owner</title><style>.t{font:600 15px Inter,system-ui,sans-serif;fill:#1F1E1D}.s{font:400 12.5px Inter,system-ui,sans-serif;fill:#6B6A65}.n{font:600 13px "JetBrains Mono",ui-monospace,monospace;fill:#1F1E1D}.a{fill:#C2603F}</style>
<rect width="760" height="380" rx="16" fill="#FAF9F5"/>
<text x="40" y="44" class="t">Review effort follows risk, not volume</text>
<g fill="none" stroke="#C9C4B8" stroke-width="1.2"><rect x="40" y="76" width="680" height="76" rx="10" fill="#F0EEE6"/><rect x="40" y="166" width="680" height="76" rx="10" fill="#F0EEE6"/></g>
<rect x="40" y="256" width="680" height="76" rx="10" fill="#FBEFE9" stroke="#D97757" stroke-width="1.8"/>
<text x="64" y="108" class="n">LOW</text><text x="64" y="130" class="s">tests · tooling · copy · safe bumps</text>
<text x="380" y="108" class="t" style="font-size:13.5px">automated review + one quick human look</text><text x="380" y="130" class="s">check it matches the ticket</text>
<text x="64" y="198" class="n">MEDIUM</text><text x="64" y="220" class="s">most feature work</text>
<text x="380" y="198" class="t" style="font-size:13.5px">author notes first, then full human review</text><text x="380" y="220" class="s">author must explain agent code unaided</text>
<text x="64" y="288" class="n a">HIGH</text><text x="64" y="310" class="s">auth · payments · migrations · customer data</text>
<text x="380" y="288" class="t" style="font-size:13.5px">two humans, one owns the system</text><text x="380" y="310" class="s">no agent-only approvals</text>
<line x1="356" y1="86" x2="356" y2="322" stroke="#C9C4B8" stroke-dasharray="3 4"/>
<text x="40" y="362" class="s">Illustrative. Replace lane rules with your team's own.</text>
</svg>
