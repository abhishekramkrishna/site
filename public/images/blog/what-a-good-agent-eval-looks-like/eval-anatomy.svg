<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="ea-t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="ea-t">Anatomy of an agent eval: a task with a clear definition of success runs as several trials; each trial leaves a transcript and an outcome; code graders, a model judge and people score them; the result is pass@1 and pass^k</title>
<style>.t{font:600 16px Inter,system-ui,sans-serif;fill:#0f2a44}.h{font:600 14px Inter,system-ui,sans-serif;fill:#0f2a44}.s{font:400 12px Inter,system-ui,sans-serif;fill:#66727f}.m{font:500 10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;fill:#2a7d7d}.n{font:600 12px "JetBrains Mono",ui-monospace,monospace;fill:#0f2a44}</style>
<rect width="760" height="400" rx="16" fill="#FAF9F5"/>
<text x="36" y="42" class="t">Anatomy of an agent eval</text>
<text x="36" y="62" class="s">Grade what actually happened, not what the agent says happened.</text>
<g fill="#fff" stroke="#ddd9cc" stroke-width="1.2">
<rect x="36" y="92" width="150" height="112" rx="12"/><rect x="214" y="92" width="150" height="112" rx="12"/><rect x="392" y="92" width="150" height="112" rx="12"/>
</g>
<rect x="570" y="92" width="154" height="112" rx="12" fill="#0f2a44"/>
<text x="52" y="116" class="m">1 · TASK</text><text x="52" y="138" class="h">One job</text><text x="52" y="158" class="s">Clear success criteria</text><text x="52" y="174" class="s">and a reference.</text><text x="52" y="190" class="s">Should and should-not</text>
<text x="230" y="116" class="m">2 · TRIALS</text><text x="230" y="138" class="h">Run it k times</text>
<g transform="translate(230,152)"><circle cx="7" cy="7" r="7" fill="#2a7d7d"/><circle cx="25" cy="7" r="7" fill="#2a7d7d"/><circle cx="43" cy="7" r="7" fill="#2a7d7d"/><circle cx="61" cy="7" r="6" fill="#fff" stroke="#B5432F" stroke-width="2"/><circle cx="79" cy="7" r="7" fill="#2a7d7d"/></g>
<text x="230" y="190" class="s">Fresh environment</text>
<text x="408" y="116" class="m">3 · RECORD</text><text x="408" y="138" class="h">What happened</text><text x="408" y="158" class="s">Every tool call, the</text><text x="408" y="174" class="s">reply, and the end</text><text x="408" y="190" class="s">state in the database.</text>
<text x="586" y="116" class="m" style="fill:#e1b03b">4 · SCORE</text><text x="586" y="140" class="h" style="fill:#fff">pass@1</text><text x="586" y="158" class="s" style="fill:#9fb3c8">average success</text><text x="586" y="180" class="h" style="fill:#fff">pass^k</text><text x="586" y="196" class="s" style="fill:#9fb3c8">all k tries succeed</text>
<g stroke="#0f2a44" stroke-width="1.6" fill="none"><path d="M186 148h22"/><path d="M364 148h22"/><path d="M542 148h22"/></g>
<g fill="#0f2a44"><path d="M208 144l7 4-7 4z"/><path d="M386 144l7 4-7 4z"/><path d="M564 144l7 4-7 4z"/></g>

<text x="36" y="242" class="m">GRADERS · EACH TRIAL PASSES ONLY IF ALL PASS</text>
<g fill="#fff" stroke="#ddd9cc" stroke-width="1.2"><rect x="36" y="256" width="216" height="110" rx="12" stroke="#2a7d7d" stroke-width="1.8"/><rect x="272" y="256" width="216" height="110" rx="12"/><rect x="508" y="256" width="216" height="110" rx="12"/></g>
<text x="52" y="282" class="h">Code</text><text x="52" y="302" class="n">refund == expected</text><text x="52" y="320" class="n">no $ over limit w/o human</text><text x="52" y="350" class="s">Fast, cheap, objective. Brittle.</text>
<text x="288" y="282" class="h">Model as judge</text><text x="288" y="302" class="s">Rubric: tone, clarity, no</text><text x="288" y="318" class="s">promises. Pass, fail or unsure.</text><text x="288" y="350" class="s">Nuanced. Needs calibration.</text>
<text x="524" y="282" class="h">People</text><text x="524" y="302" class="s">Read transcripts, grade</text><text x="524" y="318" class="s">a sample, calibrate the judge.</text><text x="524" y="350" class="s">Gold standard. Slow.</text>

<text x="36" y="390" class="s">Based on Anthropic, "Demystifying evals for AI agents" (Jan 2026).</text>
</svg>
