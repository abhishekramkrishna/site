<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="el-t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="el-t">The eval agent loop: run the suite on baseline and candidate, read the failed transcripts, group the causes, turn each failure into a new regression task, then make a ship decision by risk tier: low risk ships on evals, high risk needs a named owner</title>
<style>.t{font:600 16px Inter,system-ui,sans-serif;fill:#0f2a44}.h{font:600 13.5px Inter,system-ui,sans-serif;fill:#0f2a44}.s{font:400 12px Inter,system-ui,sans-serif;fill:#66727f}.m{font:500 10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;fill:#2a7d7d}</style>
<rect width="760" height="380" rx="16" fill="#FAF9F5"/>
<text x="36" y="42" class="t">What the eval agent does after every change</text>
<text x="36" y="62" class="s">It doesn't just score. It reads, explains and grows the suite.</text>
<g fill="#fff" stroke="#ddd9cc" stroke-width="1.2">
<rect x="36" y="90" width="196" height="84" rx="12"/><rect x="282" y="90" width="196" height="84" rx="12"/><rect x="282" y="226" width="196" height="84" rx="12"/><rect x="36" y="226" width="196" height="84" rx="12"/>
</g>
<text x="52" y="114" class="m">1 · RUN</text><text x="52" y="136" class="h">Baseline vs candidate</text><text x="52" y="156" class="s">Same tasks and seeds.</text>
<text x="298" y="114" class="m">2 · READ</text><text x="298" y="136" class="h">Every failed transcript</text><text x="298" y="156" class="s">Not just the score.</text>
<text x="298" y="250" class="m">3 · EXPLAIN</text><text x="298" y="272" class="h">Group causes by severity</text><text x="298" y="292" class="s">Policy, honesty, outcome.</text>
<text x="52" y="250" class="m">4 · GROW</text><text x="52" y="272" class="h">Failures become tasks</text><text x="52" y="292" class="s">New regression cases.</text>
<g stroke="#0f2a44" stroke-width="1.6" fill="none"><path d="M232 132h44"/><path d="M380 174v46"/><path d="M282 268h-44"/><path d="M134 226v-46"/></g>
<g fill="#0f2a44"><path d="M276 128l7 4-7 4z"/><path d="M376 220l4 7 4-7z"/><path d="M238 264l-7 4 7 4z"/><path d="M130 180l4-7 4 7z"/></g>
<path d="M478 200h40" stroke="#e1b03b" stroke-width="2" fill="none"/><path d="M518 196l7 4-7 4z" fill="#e1b03b"/>
<rect x="530" y="90" width="194" height="220" rx="12" fill="#0f2a44"/>
<text x="548" y="116" class="m" style="fill:#e1b03b">5 · DECIDE BY RISK</text>
<text x="548" y="144" class="h" style="fill:#fff">Low risk, reversible</text><text x="548" y="162" class="s" style="fill:#9fb3c8">Ships on green evals.</text>
<line x1="548" y1="180" x2="706" y2="180" stroke="#5fb3b3" stroke-opacity=".3"/>
<text x="548" y="204" class="h" style="fill:#fff">Money, data, customers</text><text x="548" y="222" class="s" style="fill:#9fb3c8">Green evals are the entry</text><text x="548" y="238" class="s" style="fill:#9fb3c8">ticket. A named owner</text><text x="548" y="254" class="s" style="fill:#9fb3c8">signs off.</text>
<text x="548" y="290" class="h" style="fill:#e1b03b">Any critical failure: HOLD</text>
<text x="36" y="350" class="s">Capability tasks that reach a high pass rate graduate into the regression suite.</text>
</svg>
