<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="pk-t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="pk-t">An agent that succeeds 75% of the time per try: pass@1 is 75%, pass@3 (any of three tries succeeds) is 98%, pass^3 (all three succeed) is 42%</title>
<style>.t{font:600 16px Inter,system-ui,sans-serif;fill:#0f2a44}.s{font:400 12px Inter,system-ui,sans-serif;fill:#66727f}.v{font:600 26px "Source Serif 4",Georgia,serif;fill:#0f2a44}.m{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#3a4654}.f{font:500 20px "Source Serif 4",Georgia,serif;fill:#0f2a44}</style>
<rect width="760" height="360" rx="16" fill="#FAF9F5"/>
<text x="36" y="42" class="t">"Works most of the time" is not "works every time"</text>
<text x="36" y="62" class="s">Same agent, 75% success per try. Which number you report changes the story.</text>
<line x1="330" y1="300" x2="724" y2="300" stroke="#0f2a44" stroke-width="1.5"/>
<rect x="350" y="150" width="90" height="150" rx="6" fill="#C9D5E0"/><text x="395" y="140" text-anchor="middle" class="v">75%</text>
<rect x="480" y="104" width="90" height="196" rx="6" fill="#C9D5E0"/><text x="525" y="94" text-anchor="middle" class="v">98%</text>
<rect x="610" y="216" width="90" height="84" rx="6" fill="#0f2a44"/><text x="655" y="206" text-anchor="middle" class="v" style="fill:#2a7d7d">42%</text>
<text x="395" y="320" text-anchor="middle" class="m">pass@1</text><text x="395" y="336" text-anchor="middle" class="s">one try</text>
<text x="525" y="320" text-anchor="middle" class="m">pass@3</text><text x="525" y="336" text-anchor="middle" class="s">any of 3 succeeds</text>
<text x="655" y="320" text-anchor="middle" class="m">pass^3</text><text x="655" y="336" text-anchor="middle" class="s">all 3 succeed</text>
<text x="36" y="124" class="f">0.75 × 0.75 × 0.75 = 0.42</text>
<text x="36" y="160" class="s">pass@k rises with more tries. Good when</text><text x="36" y="176" class="s">one success is enough (a coding agent</text><text x="36" y="192" class="s">that can retry against tests).</text>
<text x="36" y="226" class="s">pass^k falls with more tries. Good when</text><text x="36" y="242" class="s">every customer gets one try (support,</text><text x="36" y="258" class="s">payments, anything customer-facing).</text>
<rect x="36" y="276" width="10" height="10" rx="2" fill="#e1b03b"/><text x="54" y="285" class="s">Report pass^k to executives.</text>
</svg>
