name: Deploy site

# Manual for now: nothing goes live until the site owner runs this from the Actions tab.
# To publish automatically on every push to main later, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # A repository variable SITE_URL (e.g. https://abhishekramkrishna.com) overrides the GitHub Pages URL.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.SITE_URL && '/' || steps.pages.outputs.base_path }}
          # Cookieless analytics (Umami Cloud). The website ID is public: it appears in every page's source.
          # A UMAMI_WEBSITE_ID repository variable overrides it. Only this workflow sets it, so CI and test builds load no tracker.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID || '764008c3-72fc-4e4b-8b51-41f15ac01487' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
