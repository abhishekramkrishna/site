name: Bug or regression
description: Something on the site is broken or looks wrong.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: Page URL, device or browser, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
